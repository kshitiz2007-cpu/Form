services:
  - type: web
    name: mcq-test-portal
    runtime: node
    plan: free
    buildCommand: "npm install --prefix frontend && npm install --prefix backend && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mcq-portal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: mcq-portal-db
    plan: free
    databaseName: mcqportal
    user: mcqportal
